<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StrataOS</title>
    <script>
      // Theme before the first paint, so the loading screen matches it.
      try { document.documentElement.dataset.theme = localStorage.getItem("strata-theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <style>
      /* Loading screen, until the interface replaces the content of #root (same look as components/Splash.tsx). */
      html, body { margin: 0; height: 100%; background: #f4f6fb; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0a0e1a; }
      .strata-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .strata-splash img { width: 64px; height: 64px; animation: strata-in .5s ease-out both; }
      .strata-splash i { width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid rgba(100, 116, 139, .25); border-top-color: #4f6bff; animation: strata-spin .8s linear infinite; }
      html[data-theme="dark"] .strata-splash i { border-color: rgba(138, 147, 171, .25); border-top-color: #6b83ff; }
      @keyframes strata-spin { to { transform: rotate(360deg); } }
      @keyframes strata-in { from { opacity: 0; transform: scale(.92); } }
      @media (prefers-reduced-motion: reduce) { .strata-splash img { animation: none; } .strata-splash i { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="strata-splash" role="status" aria-label="StrataOS"><img src="/logo.svg" alt="" /><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
