# StrataOS automated installation (Debian 13 preseed).
# Only the system disk is asked when the machine has several disks.

### Localisation (changeable later in the web interface)
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network: DHCP on the first connected interface
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string strataos
d-i netcfg/get_domain string local
d-i netcfg/hostname string strataos
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

### Accounts: no installer user. root gets a random password generated (and
### discarded) when the ISO is built, then is locked by install.sh. The
### administrator is created in the web setup wizard (with sudo and SSH).
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @ROOT_HASH@
d-i passwd/make-user boolean false

### Partitioning: whole system disk, one ext4 partition + swap (EFI or BIOS).
### partman-auto/disk is deliberately not set: with several disks the installer
### asks which one is the system disk, so data disks are never wiped by mistake.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Packages
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string ca-certificates curl sudo
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### StrataOS itself
d-i preseed/late_command string \
  mkdir -p /target/root/strataos; \
  cp /cdrom/strata/*.deb /cdrom/strata/install.sh /target/root/strataos/; \
  in-target bash /root/strataos/install.sh

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
