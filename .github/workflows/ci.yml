# Checks the NAS (OS) on every change and pull request: Go format, vet and
# unit tests, the TypeScript build, translations, and both Debian packages.
# The full test on a virtual machine (about an hour) runs every week and on
# demand. The Android app (ci-android.yml) and the desktop app
# (ci-desktop.yml) have their own workflows, run only when their files
# change; the weekly runs cover everything.
name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "vm/**"
      - "docs/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "vm/**"
      - "docs/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the full test on a virtual machine"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go format
        run: |
          out=$(gofmt -l backend)
          test -z "$out" || { echo "not formatted: $out"; exit 1; }

      - name: Go vet and unit tests
        # Failures are also reported as an annotation, readable without signing in.
        run: |
          cd backend
          go vet ./...
          set +e
          go test ./... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -e '--- FAIL|^FAIL|^panic|_test\.go:[0-9]+|\.go:[0-9]+: ' "$RUNNER_TEMP/gotest.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Go tests failed::$msg"
          fi
          exit "$status"

      - name: Frontend types and translations
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc -b
          (cd ../backend && go run ./cmd/catalog-texts --check ../frontend/src/i18n/catalog.ts)
          node scripts/i18n-extract.cjs --check
          node scripts/i18n-lint.cjs --check
          node scripts/server-i18n.cjs ../backend/internal/i18n/texts.json --check
          node scripts/docs-site.mjs ../build/site

      - name: Shell scripts
        run: for f in vm/*.sh vm/e2e.d/*.sh packaging/*.sh packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64
          make deb ARCH=arm64

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

  # The amd64 package installed in Debian containers: trixie (Debian 13, the
  # target) must pass; forky (Debian 14, testing) warns early about
  # dependency breakage without blocking (testing changes every day).
  debian-install:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    continue-on-error: ${{ matrix.suite != 'trixie' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - name: Install in debian:${{ matrix.suite }}
        run: packaging/test-install.sh ${{ matrix.suite }}

  e2e:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat

      - name: Full test on a virtual machine
        run: make vm-test

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log
          path: vm/last-test.log
