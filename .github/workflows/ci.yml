# Checks every push and pull request: Go format, vet and unit tests, the
# TypeScript build, translations, and both Debian packages. The full test on
# a virtual machine (about an hour) runs every week and on demand.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the full test on a virtual machine"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go format
        run: |
          out=$(gofmt -l backend)
          test -z "$out" || { echo "not formatted: $out"; exit 1; }

      - name: Go vet and unit tests
        # Failures are also reported as an annotation, readable without signing in.
        run: |
          cd backend
          go vet ./...
          set +e
          go test ./... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -e '--- FAIL|^FAIL|^panic|_test\.go:[0-9]+|\.go:[0-9]+: ' "$RUNNER_TEMP/gotest.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Go tests failed::$msg"
          fi
          exit "$status"

      - name: Frontend types and translations
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc -b
          (cd ../backend && go run ./cmd/catalog-texts --check ../frontend/src/i18n/catalog.ts)
          node scripts/i18n-extract.cjs --check
          node scripts/i18n-lint.cjs --check
          node scripts/server-i18n.cjs ../backend/internal/i18n/texts.json --check
          node scripts/docs-site.mjs ../build/site

      - name: Shell scripts
        run: for f in vm/*.sh vm/e2e.d/*.sh packaging/*.sh packaging/*/*.sh desktop/packaging/*.sh desktop/packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64
          make deb ARCH=arm64

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

  # The Android app: unit tests (uploads, dedupe, certificate pinning, token
  # storage) and an unsigned release build (R8).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/gradle/libs.versions.toml
      - name: Unit tests and build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          cd android && ./gradlew --no-daemon testDebugUnitTest assembleRelease

  # ---- Desktop sync app (desktop/): tests and every package. ----
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Format, vet, unit tests
        run: |
          cd desktop
          out=$(gofmt -l .)
          test -z "$out" || { echo "not formatted: $out"; exit 1; }
          go vet ./...
          go test ./...
          # Windows and macOS compile here too (macOS without its menu bar icon: cgo).
          GOOS=windows go vet ./...
          GOOS=darwin CGO_ENABLED=0 go vet ./...
          GOOS=darwin CGO_ENABLED=0 go build -o /dev/null ./cmd/strataos-sync
      - name: Linux packages and Windows zip
        run: |
          desktop/packaging/build.sh linux
          desktop/packaging/build.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: dist/strataos-sync-*
          retention-days: 7

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Unit tests and universal app
        run: |
          (cd desktop && ../.github/scripts/annotate.sh go test ./...)
          .github/scripts/annotate.sh desktop/packaging/build.sh macos
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: dist/strataos-sync-*.dmg
          retention-days: 7

  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Unit tests, installer
        run: |
          (cd desktop && ../.github/scripts/annotate.sh go test ./...)
          .github/scripts/annotate.sh desktop/packaging/build.sh windows
          dotnet tool install --global wix --version 5.0.2
          .github/scripts/annotate.sh desktop/packaging/windows/build-msi.sh
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: dist/strataos-sync-*.msi
          retention-days: 7

  e2e:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat

      - name: Full test on a virtual machine
        run: make vm-test

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log
          path: vm/last-test.log
