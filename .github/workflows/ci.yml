# Checks the NAS (OS) on every change and pull request: Go format, vet and
# unit tests, the TypeScript build, translations, and both Debian packages.
# The end-to-end test on a virtual machine (the runners have /dev/kvm):
# the smoke subset (about 25 minutes) on pull requests, the full suite
# (about an hour) every night, on release tags and on demand. The Android app (ci-android.yml) and the desktop app
# (ci-desktop.yml) have their own workflows, run only when their files
# change; the weekly runs cover everything.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "vm/**"
      - "docs/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "vm/**"
      - "docs/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Test on a virtual machine"
        type: choice
        options: [full, smoke, none]
        default: full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go format
        run: |
          out=$(gofmt -l backend)
          test -z "$out" || { echo "not formatted: $out"; exit 1; }

      - name: Go vet and unit tests
        # Failures are also reported as an annotation, readable without signing in.
        run: |
          cd backend
          go vet ./...
          set +e
          go test ./... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -e '--- FAIL|^FAIL|^panic|_test\.go:[0-9]+|\.go:[0-9]+: ' "$RUNNER_TEMP/gotest.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Go tests failed::$msg"
          fi
          exit "$status"

      - name: Frontend types and translations
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc -b
          (cd ../backend && go run ./cmd/catalog-texts --check ../frontend/src/i18n/catalog.ts)
          node scripts/i18n-extract.cjs --check
          node scripts/i18n-lint.cjs --check
          node scripts/server-i18n.cjs ../backend/internal/i18n/texts.json --check
          node scripts/docs-site.mjs ../build/site

      - name: Shell scripts
        run: for f in vm/*.sh vm/e2e.d/*.sh packaging/*.sh packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64
          make deb ARCH=arm64

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

  # The amd64 package installed in Debian containers: trixie (Debian 13, the
  # target) must pass; forky (Debian 14, testing) warns early about
  # dependency breakage without blocking (testing changes every day).
  debian-install:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    continue-on-error: ${{ matrix.suite != 'trixie' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - name: Install in debian:${{ matrix.suite }}
        run: packaging/test-install.sh ${{ matrix.suite }}

  # The end-to-end test: a Debian 13 VM (nested KVM) with 13 disks, the
  # amd64 package of the checks job installed, vm/e2e-test.sh against it.
  e2e:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.e2e != 'none')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event_name == 'workflow_dispatch' && inputs.e2e) || 'full' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist

      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat openssl
          ls -l /dev/kvm
          # VMs inside the test VM need nested virtualisation.
          cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || true

      # The Debian cloud image (about 430 MB), checked against its SHA512SUMS
      # by vm/vm.sh; kept between runs.
      - uses: actions/cache@v5
        with:
          path: vm/images
          key: debian-13-cloud-${{ github.run_id }}
          restore-keys: debian-13-cloud-

      - name: End-to-end test (${{ env.MODE }})
        run: ./vm/ci-e2e.sh "$MODE" "dist/strataos_$(cat VERSION)_amd64.deb"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log-${{ env.MODE }}
          path: |
            vm/last-test.log
            vm/state/console.log
          retention-days: 14
