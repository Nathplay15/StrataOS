# Checks every push and pull request: Go format, vet and unit tests, the
# TypeScript build, translations, and both Debian packages. The full test on
# a virtual machine (about an hour) runs every week and on demand.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the full test on a virtual machine"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go format
        run: |
          out=$(gofmt -l backend)
          test -z "$out" || { echo "not formatted: $out"; exit 1; }

      - name: Go vet and unit tests
        run: cd backend && go vet ./... && go test ./...

      - name: Frontend types and translations
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc -b
          (cd ../backend && go run ./cmd/catalog-texts --check ../frontend/src/i18n/catalog.ts)
          node scripts/i18n-extract.cjs --check
          node scripts/i18n-lint.cjs --check
          node scripts/server-i18n.cjs ../backend/internal/i18n/texts.json --check
          node scripts/docs-site.mjs ../build/site

      - name: Shell scripts
        run: for f in vm/*.sh packaging/*.sh packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64
          make deb ARCH=arm64

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

  e2e:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat

      - name: Full test on a virtual machine
        run: make vm-test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: vm/last-test.log
