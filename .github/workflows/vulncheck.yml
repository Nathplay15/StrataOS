# Scans the Go code with govulncheck, which reports only the vulnerabilities
# whose vulnerable symbols are actually reachable from this code, in the
# backend and in the desktop sync engine. It runs on every change and every
# week, so advisories published after the last push are caught too.
name: Vulncheck

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: backend

      - name: Desktop sync engine
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: desktop
