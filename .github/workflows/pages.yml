# Publishes the StrataOS website on GitHub Pages: a download page, the
# documentation (/docs, built from the repository's Markdown by
# frontend/scripts/docs-site.mjs) and the signed APT repository (/apt) that
# installed systems update from. It runs after each release (started by
# release.yml), when the documentation changes on main, and by hand.
# Needs: Settings → Pages → Source "GitHub Actions", and the repository
# secret APT_SIGNING_KEY (the armored private archive key, see
# docs/DEVELOPMENT.md).
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packaging/pages/**"
      - "packaging/release-notes/**"
      - "frontend/scripts/docs-site.mjs"
      - "CONTRIBUTING.md"
      - "SECURITY.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Packages of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for t in $(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            gh release download "$t" --pattern '*.deb' --dir dist --skip-existing
          done
          ls dist

      - name: Signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "the APT_SIGNING_KEY secret is missing"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils >/dev/null
          ./packaging/make-repo.sh

      - name: Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh release view --json tagName -q .tagName | sed 's/^v//')
          (cd frontend && npm ci --no-audit --no-fund)
          VERSION=$V REPO=$GITHUB_REPOSITORY node frontend/scripts/docs-site.mjs site
          cp -r dist/apt site/apt
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
