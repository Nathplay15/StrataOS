# Publishes the StrataOS website on GitHub Pages: a download page, the
# documentation (/docs, built from the repository's Markdown by
# frontend/scripts/docs-site.mjs) and the signed APT repository (/apt) that
# installed systems update from. It runs after each release (started by
# release.yml), when the documentation changes on main, and by hand.
# signed APT repository (/apt) that installed systems update from, and the
# public archive key (/strataos-archive.gpg) that verifies it and the
# releases' SHA256SUMS. The repository has two suites built from every
# release's packages: "stable" (final releases) and "testing" (pre-releases
# too: the beta channel). It runs after each release (started by
# release.yml) and can be started by hand.
# Needs: Settings → Pages → Source "GitHub Actions", and the repository
# secret APT_SIGNING_KEY (the armored private archive key, see
# docs/DEVELOPMENT.md).
name: Pages

# Published after each release (started by release.yml) or by hand, so the
# documentation online always matches the released version.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Packages of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # OS releases only (the desktop ones hold strataos-sync-*.deb), pre-releases
          # too: make-repo.sh puts them in "testing" only.
          for t in $(gh release list --limit 200 --exclude-drafts --json tagName -q '.[].tagName' | grep -E '^v[0-9]'); do
            gh release download "$t" --pattern 'strataos_*.deb' --dir dist --skip-existing
          done
          ls dist

      - name: Signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "the APT_SIGNING_KEY secret is missing"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils >/dev/null
          ./packaging/make-repo.sh

      - name: Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest final OS release, by version: not "the latest release",
          # which an app release could become if it were ever marked so.
          V=$(gh release list --limit 200 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          test -n "$V" || { echo "no final OS release"; exit 1; }
          echo "OS version on the download page: $V"
          (cd frontend && npm ci --no-audit --no-fund)
          VERSION=$V REPO=$GITHUB_REPOSITORY node frontend/scripts/docs-site.mjs site
          cp -r dist/apt site/apt
          cp dist/apt/strataos-archive.gpg site/strataos-archive.gpg
          touch site/.nojekyll

      - name: Desktop updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The desktop app reads its updates from here (tauri.conf.json): the
          # newest final desktop release that has a latest.json (none without
          # the Tauri signing secrets). Never fatal: the APT repository and the
          # site above must be published whatever happens to the desktop app.
          mkdir -p site/desktop
          for v in $(gh release list --limit 200 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' |
            grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^desktop-v//' | sort -rV); do
            if gh release download "desktop-v$v" --pattern latest.json --dir site/desktop --clobber; then
              echo "latest.json of desktop-v$v published"
              break
            fi
            echo "::warning title=No desktop updater manifest::desktop-v$v has no latest.json"
          done
          ls -l site/desktop

      # One artifact name per attempt: a re-run keeps the artifacts of the
      # earlier attempts, and deploy-pages refuses two of the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # The artifact is sometimes not listed yet right after the upload: one
      # more try a minute later.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
