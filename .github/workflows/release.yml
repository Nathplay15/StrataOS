# Publishes the NAS (OS) GitHub release when a version tag (v1.2.3, matching
# VERSION) is pushed: Debian packages for amd64 and arm64, installer ISOs for
# both, and the Raspberry Pi image, with their SHA-256 checksums signed with
# the archive key (SHA256SUMS.asc). The Android app (release-android.yml, tags
# android-v*) and the desktop app (release-desktop.yml, tags desktop-v*) have
# their own versions and releases; this one also carries a copy of the newest
# Android APK and desktop latest.json for apps installed at 0.12.0 or before,
# which only look here (packaging/legacy-app-assets.sh), and it is the only
# kind of release marked "latest" on GitHub. Release notes:
# packaging/release-notes/<version>.md, followed by packaging/release-notes/footer.md
# (checking the download). Pre-releases: VERSION 0.8.0~beta.1 (or ~alpha.N,
# ~rc.N), tag v0.8.0-beta.1, notes packaging/release-notes/0.8.0-beta.1.md;
# published as a GitHub pre-release, and only to the "testing" suite (beta
# channel) of the APT repository. Needs the repository secret APT_SIGNING_KEY
# (as pages.yml). The packages point to the APT repository on GitHub Pages,
# from which installed systems update: pages.yml is started at the end, on
# main (the github-pages environment only accepts deployments from the
# default branch).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://nathplay15.github.io/StrataOS/apt

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check the version
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          # V: Debian version (VERSION), FV: the same in tags and file names
          # ("~" becomes "-"), PRERELEASE, SUITES (see backend/internal/release).
          (cd backend && go run ./cmd/release-info "$GITHUB_REF_NAME" "$(cat ../VERSION)") > release.env
          cat release.env
          . ./release.env
          test -f "packaging/release-notes/$FV.md" || { echo "missing packaging/release-notes/$FV.md"; exit 1; }
          cat release.env >> "$GITHUB_ENV"
          # Checked first: signing comes after hours of building.
          test -n "$APT_SIGNING_KEY" || { echo "the APT_SIGNING_KEY secret is missing (see docs/DEVELOPMENT.md)"; exit 1; }

      # Before the build too: fails at once when no Android release can be copied.
      - name: Apps for phones and desktops installed at 0.12.0 or before
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./packaging/legacy-app-assets.sh "$FV" "$PRERELEASE" legacy

      - name: Unit tests
        # Failures are also reported as an annotation, readable without signing in.
        run: |
          set +e
          (cd backend && go test ./...) 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -e '--- FAIL|^FAIL|^panic|_test\.go:[0-9]+|\.go:[0-9]+: ' "$RUNNER_TEMP/gotest.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Go tests failed::$msg"
            exit "$status"
          fi
          set -e
          cd frontend && npm ci --no-audit --no-fund
          npx tsc -b 2>&1 | tee "$RUNNER_TEMP/tsc.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(head -40 "$RUNNER_TEMP/tsc.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Type check failed::$msg"
          fi
          exit "$status"

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64 REPO_URL="$REPO_URL"
          make deb ARCH=arm64 REPO_URL="$REPO_URL"
          for a in amd64 arm64; do dpkg-deb --info "dist/strataos_${V}_${a}.deb" | grep -q "Architecture: $a"; done

      - name: Debian netinst images
        run: |
          mkdir -p vm/images
          for a in amd64 arm64; do
            base=https://cdimage.debian.org/debian-cd/current/$a/iso-cd
            curl -fsSL "$base/SHA256SUMS" -o "SHA256SUMS.$a"
            f=$(grep -o "debian-13[0-9.]*-$a-netinst.iso" "SHA256SUMS.$a" | head -1)
            test -n "$f"
            curl -fsSL -o "vm/images/$f" "$base/$f"
            (cd vm/images && grep " $f\$" "../../SHA256SUMS.$a" | sha256sum -c -)
          done

      - name: Installer ISOs (amd64, arm64)
        run: |
          ARCH=amd64 ./packaging/iso/build-iso.sh
          ARCH=arm64 ./packaging/iso/build-iso.sh

      - name: Raspberry Pi image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static binfmt-support parted dosfstools xz-utils debian-archive-keyring
          sudo ./packaging/rpi/build-rpi-image.sh "dist/strataos_${V}_arm64.deb"
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Checksums
        run: |
          cd dist
          # Release files are named after the tag form (no "~" in asset names).
          if [ "$V" != "$FV" ]; then
            for f in strataos_${V}_amd64.deb strataos_${V}_arm64.deb strataos-${V}-amd64.iso strataos-${V}-arm64.iso strataos-${V}-raspberrypi.img.xz; do
              [ -f "$f" ] && mv "$f" "${f//"$V"/"$FV"}"
            done
          fi
          cp ../legacy/* .
          legacy=("strataos-${FV}.apk")
          [ -f latest.json ] && legacy+=(latest.json)
          sha256sum "strataos_${FV}_amd64.deb" "strataos_${FV}_arm64.deb" "strataos-${FV}-amd64.iso" "strataos-${FV}-arm64.iso" "strataos-${FV}-raspberrypi.img.xz" "${legacy[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Detached armored signature with the archive key, the one the
      # packages trust (verification: README.md, "Checking your download").
      - name: Sign the checksums
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: ./packaging/make-repo.sh sign dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The OS release is the only one marked latest: apps installed at
          # 0.12.0 or before read releases/latest (see above).
          pre=(--latest)
          [ "$PRERELEASE" = true ] && pre=(--prerelease --latest=false)
          legacy=("dist/strataos-${FV}.apk")
          [ -f dist/latest.json ] && legacy+=(dist/latest.json)
          # Every release ends with how to check its files.
          cat "packaging/release-notes/$FV.md" packaging/release-notes/footer.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "${pre[@]}" --title "StrataOS $FV" --notes-file release-notes.md \
            "dist/strataos_${FV}_amd64.deb" "dist/strataos_${FV}_arm64.deb" \
            "dist/strataos-${FV}-amd64.iso" "dist/strataos-${FV}-arm64.iso" "dist/strataos-${FV}-raspberrypi.img.xz" \
            "${legacy[@]}" dist/SHA256SUMS dist/SHA256SUMS.asc

      - name: Update the website and APT repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
