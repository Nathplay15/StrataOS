# Publishes a GitHub release when a version tag (v1.2.3, matching VERSION) is
# pushed: Debian packages for amd64 and arm64, installer ISOs for both, and
# their SHA-256 checksums. Release notes: packaging/release-notes/<version>.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check the version
        run: |
          V=$(cat VERSION)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match VERSION $V"; exit 1; }
          test -f "packaging/release-notes/$V.md" || { echo "missing packaging/release-notes/$V.md"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          make test
          cd frontend && npm ci --no-audit --no-fund && npx tsc -b

      - name: Debian packages (amd64, arm64)
        run: |
          make deb ARCH=amd64
          make deb ARCH=arm64
          for a in amd64 arm64; do dpkg-deb --info "dist/strataos_${V}_${a}.deb" | grep -q "Architecture: $a"; done

      - name: Debian netinst images
        run: |
          mkdir -p vm/images
          for a in amd64 arm64; do
            base=https://cdimage.debian.org/debian-cd/current/$a/iso-cd
            curl -fsSL "$base/SHA256SUMS" -o "SHA256SUMS.$a"
            f=$(grep -o "debian-13[0-9.]*-$a-netinst.iso" "SHA256SUMS.$a" | head -1)
            test -n "$f"
            curl -fsSL -o "vm/images/$f" "$base/$f"
            (cd vm/images && grep " $f\$" "../../SHA256SUMS.$a" | sha256sum -c -)
          done

      - name: Installer ISOs (amd64, arm64)
        run: |
          ARCH=amd64 ./packaging/iso/build-iso.sh
          ARCH=arm64 ./packaging/iso/build-iso.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum "strataos_${V}_amd64.deb" "strataos_${V}_arm64.deb" "strataos-${V}-amd64.iso" "strataos-${V}-arm64.iso" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "StrataOS $V" --notes-file "packaging/release-notes/$V.md" \
            "dist/strataos_${V}_amd64.deb" "dist/strataos_${V}_arm64.deb" \
            "dist/strataos-${V}-amd64.iso" "dist/strataos-${V}-arm64.iso" dist/SHA256SUMS
