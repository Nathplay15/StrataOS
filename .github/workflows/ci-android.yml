# Checks the Android app (android/) on every change and pull request: lint
# (errors fail the run: a broken or incomplete translation file, a wrong
# resource), unit tests (uploads, dedupe, certificate pinning, token
# storage) and an unsigned release build (R8). It has its own version (android/VERSION) and its own
# releases (release-android.yml, tags android-v*); the weekly run covers it too.
name: CI Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/gradle/libs.versions.toml
      - name: Unit tests and build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          cd android && ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 7
